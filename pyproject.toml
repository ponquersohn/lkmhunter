[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lkmhunter"
version = "0.1.0"
description = "Kernel module hunting library and companion tools"
requires-python = ">=3.10"
dependencies = ["pyelftools>=0.31", "capstone>=5,<6"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
lkmhunter = "lkmhunter.cli:main"

[tool.setuptools.packages.find]
include = ["lkmhunter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires explicit --live-kernel and a disposable Linux VM"]
